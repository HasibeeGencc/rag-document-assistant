name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prove the tests are fully offline: no model downloads, no API keys.
      HF_HUB_OFFLINE: "1"
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          # CPU-only PyTorch first, so pip doesn't download the 2 GB GPU build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
